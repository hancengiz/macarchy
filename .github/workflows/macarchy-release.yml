name: macarchy-release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-release-app
    runs-on: macos-15
    env:
      XCODE_26_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select supported Swift toolchain
        run: |
          bash .github/gh-actions-runner-xcode-select.sh
          swift --version

      - name: Install build prerequisites
        run: brew install bash

      - name: Import signing identity (optional)
        if: ${{ secrets.MACARCHY_SIGNING_CERT != '' }}
        env:
          MACARCHY_SIGNING_CERT: ${{ secrets.MACARCHY_SIGNING_CERT }}
          MACARCHY_CERT_PASSWORD: ${{ secrets.MACARCHY_CERT_PASSWORD }}
          MACARCHY_KEYCHAIN_PASSWORD: ${{ secrets.MACARCHY_KEYCHAIN_PASSWORD }}
        run: |
          CERT_DIR="$(mktemp -d)"
          printf '%s' "$MACARCHY_SIGNING_CERT" | base64 -d > "$CERT_DIR/cert.p12"
          security create-keychain -p "$MACARCHY_KEYCHAIN_PASSWORD" build.keychain
          security import "$CERT_DIR/cert.p12" -k build.keychain \
            -P "$MACARCHY_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$MACARCHY_KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db

      - name: Build versioned release app
        run: |
          args=(--build-only)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--build-version "${GITHUB_REF_NAME#v}" --release)
          fi
          python3 macarchy/install.py "${args[@]}"

      - name: Run tests
        run: |
          swift test
          python3 -m unittest discover -s macarchy -p 'test_*.py'

      - name: Smoke packaged executables
        run: |
          .local/macarchy.app/Contents/MacOS/macarchy --version
          .local/macarchy.app/Contents/Helpers/macarchy --help
          codesign --verify --deep --strict .local/macarchy.app

      - name: Generate appcast (tag releases)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -eu
          curl -sL -o /tmp/sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.7.3/Sparkle-2.7.3.tar.xz
          mkdir -p /tmp/sparkle-dist && tar xf /tmp/sparkle.tar.xz -C /tmp/sparkle-dist
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle.privkey
          /tmp/sparkle-dist/bin/generate_appcast \
            --ed-key-file /tmp/sparkle.privkey \
            --download-url-prefix "https://github.com/hancengiz/macarchy/releases/download/${GITHUB_REF_NAME}/" \
            .local/
          test -f .local/appcast.xml

      - name: Archive release app
        run: ditto -c -k --keepParent .local/macarchy.app macarchy.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macarchy.app
          path: macarchy.app.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macarchy.app.zip
            .local/appcast.xml
          name: macarchy ${{ github.ref_name }}
          body: |
            Apple Silicon (arm64), macOS 13 or newer.

            Download and extract `macarchy.app.zip`, then grant Macarchy Accessibility access.
            GitHub Actions builds are ad-hoc signed and are not notarized.
