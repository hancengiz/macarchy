name: macarchy-release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-release-app
    runs-on: macos-15
    env:
      XCODE_26_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select supported Swift toolchain
        run: |
          bash .github/gh-actions-runner-xcode-select.sh
          swift --version

      - name: Install build prerequisites
        run: brew install bash

      - name: Build versioned release app
        run: |
          args=(--build-only)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--build-version "${GITHUB_REF_NAME#v}")
          fi
          python3 macarchy/install.py "${args[@]}"

      - name: Run tests
        run: |
          swift test
          python3 -m unittest discover -s macarchy -p 'test_*.py'

      - name: Smoke packaged executables
        run: |
          .local/macarchy.app/Contents/MacOS/macarchy --version
          .local/macarchy.app/Contents/Helpers/macarchy --help
          codesign --verify --deep --strict .local/macarchy.app

      - name: Archive release app
        run: ditto -c -k --keepParent .local/macarchy.app macarchy.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macarchy.app
          path: macarchy.app.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: macarchy.app.zip
          name: macarchy ${{ github.ref_name }}
          body: |
            Apple Silicon (arm64), macOS 13 or newer.

            Download and extract `macarchy.app.zip`, then grant Macarchy Accessibility access.
            GitHub Actions builds are ad-hoc signed and are not notarized.
